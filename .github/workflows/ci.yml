name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy tmi tests

      - name: Pytest
        run: pytest

      - name: Run deterministic example
        run: python -m tmi examples/btc_event.json

      - name: Run gateway recording example
        run: >-
          python -m tmi
          examples/btc_gateway_event.json
          --gateway-recording examples/gateway_quotes.jsonl
